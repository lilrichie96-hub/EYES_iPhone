name: EYES iPhone 2.5 web abilities QA
on:
  push:
    branches: [feature/iphone-abilities-250]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax and feature references
        run: |
          set -euo pipefail
          for f in eyes-ios-abilities.js eyes-ios-pocket.js eyes-ios-weather.js eyes-ios-vision.js eyes-ios-arcade.js eyes-friends.js sw.js; do node --check "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          sw=Path('sw.js').read_text()
          for f in ['eyes-ios-abilities.js','eyes-ios-abilities.css','eyes-ios-pocket.js','eyes-ios-arcade.js','eyes-ios-weather.js','eyes-ios-vision.js']:
            assert Path(f).exists(), f
            assert f in html and f in sw, f+' missing from HTML/cache'
          assert 'eyes-web-2.5.0' in sw
          print('2.5.0 asset and cache references verified')
          PY
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Start static app server and test iPhone and Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/eyes-ios-http.log 2>&1 &
          node qa/iphone-abilities-smoke.cjs
