name: Assemble verified EYES launch website
on:
  push:
    branches: [eyes-launch-site-staging]
    paths: ['.eyes-launch-staging/**', '.github/workflows/eyes-launch-assemble.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify launch media
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, base64, json, subprocess
          root=pathlib.Path('.eyes-launch-staging')
          def join(prefix, count, sha):
              parts=sorted(root.glob(prefix+'-*.part'))
              assert len(parts)==count
              b=b''.join(p.read_bytes() for p in parts)
              assert hashlib.sha256(b).hexdigest()==sha, prefix
              return b
          manifest=json.loads(join('manifest',4,'ae8b730ab00222999a0fdd853ae5bd5ae1974c43db87cb9938a9230c21e4c391'))
          assert len(manifest)==62
          for item in manifest:
              path=pathlib.Path(item['path'])
              assert path.parts[0]=='get' and '..' not in path.parts and path.suffix!='.apk'
              b=base64.b64decode(item['base64']) if 'base64' in item else item['content'].encode()
              assert hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()==item['sha'],path
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(b)
          trailer=join('trailer',10,'004341bf0531ef372fc7ef4bc7da289e7ec096c129e18286025888151e2eddc3')
          pathlib.Path('get/media/trailer/eyes-trailer-web.mp4').write_bytes(trailer)
          assert hashlib.sha256(pathlib.Path('get/EYES_4.9.0_build126_SIGNED.apk').read_bytes()).hexdigest()=='b40020c359cbb3114209eb4b6f6a52bbd151e7a96724b6196f0b37302a8e7123'
          assert 'eyes-web-3.0.0-rc1' in pathlib.Path('sw.js').read_text()
          assert "exchange: 'show'" in pathlib.Path('get/config.js').read_text()
          print('Verified all 62 launch assets, full trailer, existing signed APK and iPhone cache.')
          PY
      - name: Commit verified website to staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .eyes-launch-staging
          git rm .github/workflows/eyes-launch-assemble.yml
          git add get/
          git commit -m 'Assemble EYES 5.0 launch website and verified trailer'
          git push origin HEAD:eyes-launch-site-staging
