name: Install and publish EYES for iPhone

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/deploy-eyes.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: eyes-iphone-pages
  cancel-in-progress: false

jobs:
  install-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch verified EYES v1.0.0 package
        env:
          EYES_DRIVE_ID: 17MbpcfA-wwDpCkkgiLX955zXN41lwcAC
          EYES_SHA256: 4849f4bffd3a052a0954863688fc4e5098a7176804a5371ed51405136623dbec
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request, zipfile
          url = 'https://drive.google.com/uc?export=download&id=' + os.environ['EYES_DRIVE_ID']
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  content = response.read()
          except Exception as exc:
              raise SystemExit(f'Cannot download the EYES package from Google Drive: {exc}')
          digest = hashlib.sha256(content).hexdigest()
          if digest != os.environ['EYES_SHA256']:
              raise SystemExit('Google Drive download is unavailable or not the expected EYES ZIP. Set sharing to Anyone with the link > Viewer and retry.')
          archive = pathlib.Path('/tmp/eyes-iphone.zip')
          archive.write_bytes(content)
          with zipfile.ZipFile(archive) as z:
              needed = {'index.html','eyes-app.js','eyes-link.js','haven-dna.js','awakening.js','awakening.css','eyes-web.css','sw.js','eyes-boot.js','manifest.webmanifest','icons/icon-192.png','icons/icon-512.png','icons/apple-touch-icon.png','icons/icon-maskable-512.png'}
              if not needed.issubset(z.namelist()):
                  raise SystemExit('The EYES package is missing required files')
              for member in z.infolist():
                  p = pathlib.PurePosixPath(member.filename)
                  if p.is_absolute() or '..' in p.parts or member.filename.startswith('.github/'):
                      raise SystemExit('Unexpected path in ZIP: ' + member.filename)
              z.extractall('.')
          print('Extracted original EYES iPhone v1.0.0 package.')
          PY

      - name: Commit original site files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import verified EYES iPhone v1.0.0 source'
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
