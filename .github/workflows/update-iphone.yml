name: Update EYES iPhone 2.0.1

on:
  push:
    paths:
      - .github/workflows/update-iphone.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: eyes-iphone-deployment
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify EYES iPhone 2.0.1
        shell: bash
        env:
          EYES_FILE_ID: 17MbpcfA-wwDpCkkgiLX955zXN41lwcAC
          EYES_SHA256: 0608323c7d9c55ba5f8297a6a4d8ccb23652b54dcc9f238b6edb3ec7a1f29b78
        run: |
          python3 - <<'PY'
          import os,hashlib,urllib.request,zipfile,io,pathlib
          url='https://drive.google.com/uc?export=download&id='+os.environ['EYES_FILE_ID']
          with urllib.request.urlopen(url,timeout=45) as resp: b=resp.read()
          if hashlib.sha256(b).hexdigest()!=os.environ['EYES_SHA256']:
              raise SystemExit('EYES 2.0.1 package SHA-256 mismatch')
          dst=pathlib.Path('/tmp/eyes-iphone-site')
          dst.mkdir()
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              required={'index.html','sw.js','manifest.webmanifest','eyes-web-shim.js','eyes-web-shell.js','eyes-friends.js','eyes-push.js','eyes-dex.js','eyes-play.js','eyes-social.js','eyes-config.js','eyes-senses.js','eye-render.js','haven-dna.js','awakening.js','icons/icon-192.png','icons/icon-512.png','icons/apple-touch-icon.png','.nojekyll'}
              names=set(z.namelist())
              if not required.issubset(names):
                  raise SystemExit('EYES 2.0.1 package missing site components: '+str(required-names))
              for item in z.infolist():
                  path=pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or item.filename.startswith('.github/'):
                      raise SystemExit('Unsafe ZIP filename: '+item.filename)
              z.extractall(dst)
          import shutil
          for path in dst.iterdir():
              target=pathlib.Path('.')/path.name
              if path.is_dir():
                  shutil.copytree(path,target,dirs_exist_ok=True)
              else:
                  shutil.copy2(path,target)
          for old in ('eyes-app.js','eyes-boot.js','eyes-link.js'):
              pathlib.Path(old).unlink(missing_ok=True)
          assert b'eyes-web-2.0.1' in (dst/'sw.js').read_bytes()
          assert b'https://lilrichie96-hub.github.io/EYES_iPhone/' in (dst/'eyes-config.js').read_bytes()
          assert b'eyes.link.v1' in (dst/'eyes-friends.js').read_bytes()
          print('Imported EYES iPhone 2.0.1 gameplay patch; retained existing storage and Friend links')
          PY
      - name: Commit new EYES app to public repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish EYES iPhone 2.0.1 with Senses and shared renderer'
            git push
          fi
      - name: Configure existing GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare published site
        shell: bash
        run: |
          mkdir -p /tmp/eyes-publish
          python3 - <<'PY'
          import zipfile,io,os,urllib.request,pathlib,hashlib
          url='https://drive.google.com/uc?export=download&id=17MbpcfA-wwDpCkkgiLX955zXN41lwcAC'
          b=urllib.request.urlopen(url,timeout=45).read()
          assert hashlib.sha256(b).hexdigest()=='0608323c7d9c55ba5f8297a6a4d8ccb23652b54dcc9f238b6edb3ec7a1f29b78'
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              z.extractall('/tmp/eyes-publish')
          PY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/eyes-publish
      - name: Deploy iPhone app to Pages
        id: deploy
        uses: actions/deploy-pages@v4
